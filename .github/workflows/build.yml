name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ============================================================
  # macOS (Universal Binary: arm64 + x86_64)
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (arm64)
        run: npx tauri build --ci --bundles dmg

      - name: Build Rust (Intel x86_64)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin

      - name: Replace binary with universal
        run: |
          lipo -create \
            src-tauri/target/release/dailyreport-guard \
            src-tauri/target/x86_64-apple-darwin/release/dailyreport-guard \
            -output src-tauri/target/release/bundle/macos/日报守卫.app/Contents/MacOS/dailyreport-guard

      - name: Re-create universal dmg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          rm -f src-tauri/target/release/bundle/dmg/*.dmg
          hdiutil create \
            -volname "日报守卫" \
            -srcfolder src-tauri/target/release/bundle/macos/日报守卫.app \
            -ov -format UDZO \
            "src-tauri/target/release/bundle/dmg/日报守卫_${VERSION}_universal.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dailyreport-guard-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ============================================================
  # Windows (NSIS installer)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --ci --bundles nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dailyreport-guard-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ============================================================
  # 创建 GitHub Release（等待所有构建完成）
  # ============================================================
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
