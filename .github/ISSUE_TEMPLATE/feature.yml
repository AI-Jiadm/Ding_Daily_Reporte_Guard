name: 功能建议
description: 建议新功能或改进现有功能
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: 关联的现有功能
      options:
        - 日报检查
        - 日历
        - 配置 / 初始化
        - 工作通知
        - 托盘
        - 发布 / 安装
        - 全新功能
        - 其他
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: 描述你的需求
      description: 你遇到了什么问题？为什么需要这个功能？
      placeholder: 描述使用场景和痛点
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
      description: 你希望这个功能如何工作？
      placeholder: 描述理想的用户体验

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、其他工具的实现等
      placeholder: 选填
